  <!-- Angular tech infinity (blue) - geometric with sharp transitions -->
  <path d="M 6 16 L 10 12 L 14 12 L 16 14 L 16 16 L 18 18 L 22 18 L 26 14 L 26 12 L 22 16 L 18 16 L 16 18 L 16 16 L 14 14 L 10 14 L 6 18 Z" 
