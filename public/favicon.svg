  </defs>
  
  <!-- Flowing spiritual infinity (gold) - smooth curves -->
  <path d="M 8 16 Q 8 12 12 12 Q 16 12 16 16 Q 16 20 20 20 Q 24 20 24 16 Q 24 12 20 12 Q 16 12 16 16 Q 16 20 12 20 Q 8 20 8 16 Z" 
